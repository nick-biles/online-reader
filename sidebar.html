<!DOCTYPE html>
<html lang="en" class="colormodelight">
<head>
<link rel="stylesheet" href="sidebar.css">
    <body id="sidebar">
        <div class="functionblock" id="autoscrolldiv">
            <h1>Autoscroll</h1>
            <div id="scrollspeeddiv">
                <label id="scrollspeedlabel" for="scrollspeed">Scroll Speed: </label>
                <input id="scrollspeed" type="number" min=1 max=200 value=14 >
            </div>
            <button id="scrollbutton" class="halfbutton">Start Scrolling</button>
            <button id="autoscrollbutton" class="halfbutton">Start Auto Scrolling</button>
            <button id="stopscrollbutton" class="fullbutton">Stop Scrolling</button>
        </div>
    </body>
    <script type="text/javascript" src="action-menu.js"></script>
</head>
</html>
